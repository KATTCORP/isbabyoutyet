# Seed Convex preview homepage photos after Vercel is Ready.
#
# Preview photo uploads (sharp + storage) used to run inside `deploy-convex.ts`
# and dominated Vercel build time. Demo login + fixture text still seed during
# the Vercel build when the preview backend is recreated; photos follow here.
#
# Requires GitHub Actions secret CONVEX_DEPLOY_KEY = Convex Preview Deploy Key
# (same key Vercel uses for preview CONVEX_DEPLOY_KEY).

name: seed-preview

on:
  deployment_status:

concurrency:
  group: seed-preview-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  seed-homepage-photos:
    # Vercel sets `github.ref` / `deployment.ref` to the commit SHA, so a
    # job-level `contains(github.ref, 'gh-readonly-queue')` never matches.
    # The runner env `GITHUB_REF` is `refs/heads/gh-readonly-queue/…`.
    if: >
      github.event.deployment_status.state == 'success'
      && !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Skip merge-queue deployments
        id: queue
        run: |
          if [[ "${GITHUB_REF:-}" == *gh-readonly-queue* ]]; then
            echo "Merge queue deployment — skipping Convex photo seed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed commit
        if: steps.queue.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.queue.outputs.skip != 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.queue.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.queue.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Seed homepage demo photos
        if: steps.queue.outputs.skip != 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY is not set in GitHub secrets; cannot seed Convex preview photos."
            exit 1
          fi
          # Skip before resolving a SHA to a PR head — that head is the
          # feature branch and would seed the PR Convex preview. `GITHUB_REF`
          # is `refs/heads/gh-readonly-queue/…` on queue deploys.
          if [[ "${GITHUB_REF:-}" == *gh-readonly-queue* || "$DEPLOYMENT_REF" == *gh-readonly-queue* ]]; then
            echo "Merge queue deployment — skipping Convex photo seed"
            exit 0
          fi
          # Vercel GitHub deployments set ref to the commit SHA. Convex
          # preview names follow VERCEL_GIT_COMMIT_REF (the git branch).
          BRANCH=""
          if [[ "$DEPLOYMENT_REF" =~ ^refs/heads/ ]]; then
            BRANCH="${DEPLOYMENT_REF#refs/heads/}"
          elif [[ "$DEPLOYMENT_REF" =~ ^[0-9a-f]{7,40}$ ]]; then
            BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOYMENT_SHA}/pulls" --jq '.[0].head.ref // empty')"
          else
            BRANCH="$DEPLOYMENT_REF"
          fi
          if [ -z "$BRANCH" ]; then
            git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
            BRANCH="$(git for-each-ref --points-at HEAD --format='%(refname:short)' refs/remotes/origin | sed 's|^origin/||' | grep -v '^HEAD$' | head -1)"
          fi
          if [[ "$BRANCH" == *gh-readonly-queue* ]]; then
            echo "Merge queue deployment — skipping Convex photo seed"
            exit 0
          fi
          if [ -z "$BRANCH" ]; then
            echo "Could not resolve Convex preview name for ${DEPLOYMENT_SHA}"
            exit 1
          fi
          echo "Seeding Convex preview ${BRANCH}"
          pnpm --filter @baby-outlet/backend run seed:homepage:photos -- --preview-name "$BRANCH"
