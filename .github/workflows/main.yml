name: main

on:
  pull_request:
    types: [synchronize, opened, reopened]
  # Merge queue tests a temporary merge commit (`gh-readonly-queue/...`).
  # Without this, required checks never start and the queue waits forever.
  merge_group:
  push:
    branches: [main, next, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Changed-test / coverage baseline SHAs:
  # - pull_request: PR base and branch tip
  # - merge_group: parent of the speculative merge (previous queue entry, or
  #   the target-branch tip if this is first) and the merge-group HEAD
  # - push: github.sha as HEAD; CI_BASE_SHA is unused
  CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
  CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          # Need enough history for `vitest --changed <base.sha>` merge-base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      # OIDC exchange via TURBO_TEAM + Vercel Turborepo CLI policy (no TURBO_TOKEN secret).
      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint-fix

      - name: Typecheck
        run: pnpm typecheck

      # PRs and merge groups: Vitest --changed only (no coverage).
      # Merge queue compares against merge_group.base_sha — the previous queue
      # commit — so later entries do not re-run the whole queue's tests.
      - name: Show changed-test range
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          if [ -z "${CI_BASE_SHA}" ]; then
            echo "CI_BASE_SHA is empty" >&2
            exit 1
          fi
          git rev-parse --verify "${CI_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${CI_BASE_SHA}" HEAD
          PARENT="$(git rev-parse HEAD~1)"
          {
            echo "## Changed-test range"
            echo ""
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              echo "Merge queue: \`vitest --changed\` vs previous queue commit (\`merge_group.base_sha\`)."
              echo "First parent of HEAD: \`${PARENT}\`"
              if [ "${CI_BASE_SHA}" != "${PARENT}" ]; then
                echo "Note: payload SHA differs from \`HEAD~1\`; using \`merge_group.base_sha\`."
              fi
            else
              echo "PR: \`vitest --changed\` vs \`pull_request.base.sha\`."
            fi
            echo ""
            echo "- Base: \`${CI_BASE_SHA}\`"
            echo "- HEAD: \`$(git rev-parse HEAD)\`"
            echo ""
            echo '```'
            git log --oneline "${CI_BASE_SHA}..HEAD"
            echo '```'
            echo ""
            echo "Changed files:"
            echo '```'
            git diff --name-only "${CI_BASE_SHA}"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Test (changed vs base)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          pnpm pretest:coverage
          pnpm exec vitest run --changed "$CI_BASE_SHA"

      - name: Knip
        run: pnpm knip

  # Parallel with `checks`. Full-suite coverage + local ratchet vs PR base SHA
  # (main push or stacked inner-PR tip). Codecov.io upload is history-only.
  # Skip in the merge queue: coverage already ratcheted on the PR, and skipped
  # jobs still report success for required checks.
  codecov:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # Stacked PRs often MISS the base cache and measure base + head (~5 min).
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          # On PRs, start from the branch tip (not the merge commit).
          ref: ${{ env.CI_HEAD_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Prefer exact coverage for CI_BASE_SHA. On miss, remasure that SHA.
      # If remasure fails (base tip red — often not this PR), fall back to the
      # latest successful tip saved under coverage-summary-branch-<ref>-*.
      - name: Resolve base branch cache alias
        id: baseline-ref
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="${{ github.event.pull_request.base.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi
          ALIAS="$(printf '%s' "$REF" | tr '/' '-')"
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Restore PR base coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ env.CI_BASE_SHA }}

      # Remasure runs the PR base tip — not this branch. Failures here are often
      # inherited from main (merge queue skips codecov). Always return to HEAD.
      - name: Measure PR base coverage baseline
        id: measure-base
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.baseline-ref.outputs.ref }}"
          echo "::notice title=Coverage remasure on PR base tip::Measuring ${CI_BASE_SHA} (${BASE_REF}). Failures in this step are on the base tip — not this PR branch."
          restore_head() {
            git checkout --force "$CI_HEAD_SHA"
            pnpm install --frozen-lockfile
          }
          trap restore_head EXIT
          git checkout --force "$CI_BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm exec turbo run test:coverage
          test -f coverage/coverage-summary.json
          mkdir -p .coverage-baseline
          cp coverage/coverage-summary.json .coverage-baseline/coverage-summary.json
          printf '%s\n' "$CI_BASE_SHA" > .coverage-baseline/source-sha.txt
          printf 'exact-remasure\n' > .coverage-baseline/source-kind.txt
          trap - EXIT
          restore_head

      - name: Warn that base tip remasure failed
        if: >-
          github.event_name == 'pull_request' &&
          steps.measure-base.outcome == 'failure'
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.baseline-ref.outputs.ref }}"
          MSG="Remeasuring \`${CI_BASE_SHA}\` on \`${BASE_REF}\` failed. That SHA is the PR **base tip**, not this branch — test/coverage failures in the remasure step are usually not caused by this PR. Falling back to the last successful \`${BASE_REF}\` coverage cache when available."
          echo "::warning title=PR base tip remasure failed (likely not this branch)::${MSG}"
          {
            echo "## Coverage remasure"
            echo ""
            echo "> [!WARNING]"
            echo "> ${MSG}"
            echo ""
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Restore last successful base-branch coverage baseline
        id: baseline-fallback
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline.outputs.cache-hit != 'true' &&
          steps.measure-base.outcome == 'failure'
        uses: actions/cache/restore@v6
        with:
          path: .coverage-baseline
          # Unique key per tip; restore-keys picks the newest green tip for the
          # base branch when the exact base SHA was never cached.
          key: coverage-summary-branch-${{ steps.baseline-ref.outputs.alias }}-${{ env.CI_BASE_SHA }}
          restore-keys: |
            coverage-summary-branch-${{ steps.baseline-ref.outputs.alias }}-

      - name: Report coverage baseline source
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.baseline-ref.outputs.ref }}"
          ALIAS="${{ steps.baseline-ref.outputs.alias }}"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "## Coverage baseline"
            echo ""
          } | tee -a "$SUMMARY"

          if [ "${{ steps.baseline.outputs.cache-hit }}" = "true" ]; then
            KIND="exact-cache"
            SOURCE_SHA="$CI_BASE_SHA"
          elif [ "${{ steps.measure-base.outcome }}" = "success" ]; then
            KIND="exact-remasure"
            SOURCE_SHA="$CI_BASE_SHA"
          elif [ -f .coverage-baseline/coverage-summary.json ]; then
            # restore-keys hits set cache-hit=false; trust the restored files.
            KIND="branch-fallback"
            if [ -f .coverage-baseline/source-sha.txt ]; then
              SOURCE_SHA="$(tr -d '[:space:]' < .coverage-baseline/source-sha.txt)"
            else
              SOURCE_SHA="unknown (missing source-sha.txt)"
            fi
          else
            {
              echo "::error title=No coverage baseline (base tip broken — not this PR)::Could not restore or remasure base \`${CI_BASE_SHA}\` (\`${BASE_REF}\`), and no last-successful branch baseline exists either."
              echo ""
              echo "The remasure step runs **the PR base tip**, not this branch. The Vitest failures above are on \`${BASE_REF}\` @ \`${CI_BASE_SHA}\` — fix or bypass on the base branch; this PR may be fine."
              echo ""
              echo "- Base SHA: \`${CI_BASE_SHA}\`"
              echo "- Base ref: \`${BASE_REF}\`"
              echo "- Exact cache: miss"
              echo "- Exact remasure: ${{ steps.measure-base.outcome }}"
              echo "- Branch fallback prefix: \`coverage-summary-branch-${ALIAS}-\`: miss"
            } | tee -a "$SUMMARY"
            exit 1
          fi

          if [ ! -f .coverage-baseline/coverage-summary.json ]; then
            echo "::error::Baseline present according to restore/remasure, but coverage-summary.json is missing" >&2
            exit 1
          fi

          printf '%s\n' "$KIND" > .coverage-baseline/source-kind.txt
          if [ ! -f .coverage-baseline/source-sha.txt ]; then
            printf '%s\n' "$SOURCE_SHA" > .coverage-baseline/source-sha.txt
          fi
          {
            echo "- Kind: \`${KIND}\`"
            echo "- Baseline SHA: \`${SOURCE_SHA}\`"
            echo "- PR base SHA: \`${CI_BASE_SHA}\`"
            echo "- PR base ref: \`${BASE_REF}\`"
            if [ "$KIND" = "branch-fallback" ]; then
              echo "- Matched cache key: \`${{ steps.baseline-fallback.outputs.cache-matched-key }}\`"
            fi
            echo ""
          } | tee -a "$SUMMARY"

          if [ "$KIND" = "branch-fallback" ]; then
            MSG="Exact base \`${CI_BASE_SHA}\` on \`${BASE_REF}\` could not be measured (tests failing on the **base tip**, not necessarily this PR). Using last successful \`${BASE_REF}\` coverage (\`${SOURCE_SHA}\`). Ratchet may reflect base-tip drift."
            echo "::warning title=Coverage baseline fell back to last green base branch tip::${MSG}"
            {
              echo "> [!WARNING]"
              echo "> ${MSG}"
              echo ">"
              echo "> Remasure logs are for \`${CI_BASE_SHA}\` on \`${BASE_REF}\` — do not treat those failures as regressions introduced by this branch."
              echo ""
            } | tee -a "$SUMMARY"
          fi

      - name: Full coverage (Turbo-cached)
        run: |
          pnpm exec turbo run test:coverage
          test -f coverage/coverage-summary.json

      - name: Compare coverage with PR base
        if: github.event_name == 'pull_request'
        run: |
          test -f .coverage-baseline/coverage-summary.json
          pnpm coverage:compare

      # Cache this tip so stacked outer PRs can restore it as their base.
      - name: Prepare coverage baseline for cache
        run: |
          set -euo pipefail
          mkdir -p .coverage-baseline
          cp coverage/coverage-summary.json .coverage-baseline/coverage-summary.json
          printf '%s\n' "$CI_HEAD_SHA" > .coverage-baseline/source-sha.txt
          printf 'head\n' > .coverage-baseline/source-kind.txt

      - name: Save coverage baseline
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ env.CI_HEAD_SHA }}

      # Floating "last green tip" for this branch (push only). Unique key per
      # SHA so saves do not collide; PR fallback uses restore-keys on the prefix.
      - name: Save last successful branch coverage baseline
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-branch-${{ steps.baseline-ref.outputs.alias }}-${{ env.CI_HEAD_SHA }}

      # History only — codecov.yml disables GitHub statuses/comments/checks.
      - name: Upload coverage to Codecov
        if: hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          name: vitest
          override_commit: ${{ env.CI_HEAD_SHA }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: false
          verbose: true
