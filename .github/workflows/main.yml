name: main

on:
  pull_request:
    types: [synchronize, opened, reopened]
  # Merge queue tests a temporary merge commit (`gh-readonly-queue/...`).
  # Without this, required checks never start and the queue waits forever.
  merge_group:
  push:
    branches: [main, next, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Changed-test / coverage baseline SHAs:
  # - pull_request: PR base and branch tip
  # - merge_group: parent of the speculative merge (previous queue entry, or
  #   the target-branch tip if this is first) and the merge-group HEAD
  # - push: github.sha as HEAD; CI_BASE_SHA is unused
  CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
  CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # About 1 min on PRs; the merge queue adds `vitest --changed`. Do not raise
    # this. If the job gets close, refactor or speed up the slow step or tests.
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          # Need enough history for `vitest --changed <base.sha>` merge-base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      # OIDC exchange via TURBO_TEAM + Vercel Turborepo CLI policy (no TURBO_TOKEN secret).
      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint-fix

      - name: Typecheck
        run: pnpm typecheck

      # Merge queue only: Vitest --changed (no coverage), against
      # merge_group.base_sha — the previous queue commit — so later entries do
      # not re-run the whole queue's tests. PRs skip this: the codecov job
      # already runs every affected workspace's tests.
      - name: Show changed-test range
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          if [ -z "${CI_BASE_SHA}" ]; then
            echo "CI_BASE_SHA is empty" >&2
            exit 1
          fi
          git rev-parse --verify "${CI_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${CI_BASE_SHA}" HEAD
          PARENT="$(git rev-parse HEAD~1)"
          {
            echo "## Changed-test range"
            echo ""
            echo "Merge queue: \`vitest --changed\` vs previous queue commit (\`merge_group.base_sha\`)."
            echo "First parent of HEAD: \`${PARENT}\`"
            if [ "${CI_BASE_SHA}" != "${PARENT}" ]; then
              echo "Note: payload SHA differs from \`HEAD~1\`; using \`merge_group.base_sha\`."
            fi
            echo ""
            echo "- Base: \`${CI_BASE_SHA}\`"
            echo "- HEAD: \`$(git rev-parse HEAD)\`"
            echo ""
            echo '```'
            git log --oneline "${CI_BASE_SHA}..HEAD"
            echo '```'
            echo ""
            echo "Changed files:"
            echo '```'
            git diff --name-only "${CI_BASE_SHA}"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Test (changed vs base)
        if: github.event_name == 'merge_group'
        run: |
          pnpm pretest
          pnpm exec vitest run --changed "$CI_BASE_SHA"

      - name: Knip
        run: pnpm knip

  # Parallel with `checks`. Per-workspace coverage (Turbo-cached, so untouched
  # workspaces are restored, not rerun) + per-workspace ratchet vs PR base SHA
  # (main push or stacked inner-PR tip). Codecov.io upload is history-only.
  # Skip in the merge queue: coverage already ratcheted on the PR, and skipped
  # jobs still report success for required checks.
  codecov:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # Usually 35-100s. Worst case (no base baseline, nothing Turbo-cached)
    # waits for the base artifact, then measures every workspace at base +
    # head: about 5 min. Do not raise this. If the job gets close, refactor or
    # speed up the slow tests instead.
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
      # List Actions caches so remasure failure can fall back to the newest
      # ancestor of CI_BASE_SHA that already has coverage-summary-<sha>, and
      # read the base tip's jobs / artifacts while waiting on its codecov job.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          # On PRs, start from the branch tip (not the merge commit).
          ref: ${{ env.CI_HEAD_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Prefer exact coverage for CI_BASE_SHA. On miss, remasure that SHA.
      # If remasure fails (base tip red — often not this PR), fall back to:
      # 1) last green tip saved under coverage-summary-branch-<ref>-*
      # 2) newest ancestor of CI_BASE_SHA with an exact coverage-summary-<sha>
      #    cache (covers historical greens before the branch key existed).
      - name: Resolve base branch cache alias
        id: baseline-ref
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="${{ github.event.pull_request.base.ref }}"
          else
            REF="${{ github.ref_name }}"
          fi
          ALIAS="$(printf '%s' "$REF" | tr '/' '-')"
          echo "alias=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Restore PR base coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ env.CI_BASE_SHA }}

      # Stacked PRs: the inner PR saved its cache under refs/pull/<n>/merge,
      # which this ref cannot restore, and its job is usually still running.
      # Artifacts download across refs, so wait for the base tip's codecov job
      # instead of remeasuring the base tip ourselves. Cap the wait below what a
      # base remeasure costs (~1.5 min) so the worst case still fits the timeout.
      - name: Wait for PR base coverage artifact
        id: baseline-artifact
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WAIT_SECONDS: "90"
        run: |
          set -euo pipefail
          NAME="coverage-baseline-${CI_BASE_SHA}"
          DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            PENDING=false
            RUN_IDS="$(gh api "/repos/${REPO}/actions/workflows/main.yml/runs?head_sha=${CI_BASE_SHA}&per_page=20" --jq '.workflow_runs[].id')"
            for RUN_ID in $RUN_IDS; do
              JOB="$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
                --jq '.jobs[] | select(.name == "codecov") | "\(.status) \(.conclusion // "")"' | head -n 1)"
              case "$JOB" in
                "completed success")
                  if gh run download "$RUN_ID" --repo "$REPO" --name "$NAME" --dir .coverage-baseline; then
                    echo "Downloaded ${NAME} from run ${RUN_ID}"
                    echo "hit=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  ;;
                completed*|"") ;;
                *) PENDING=true ;;
              esac
            done
            if [ "$PENDING" != true ]; then
              echo "No running or successful codecov job with ${NAME} for ${CI_BASE_SHA}"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::warning title=Timed out waiting for base coverage::codecov for ${CI_BASE_SHA} still running after ${WAIT_SECONDS}s; remeasuring the base tip."
              break
            fi
            echo "Waiting for codecov on ${CI_BASE_SHA}…"
            sleep 15
          done
          rm -rf .coverage-baseline
          echo "hit=false" >> "$GITHUB_OUTPUT"

      # Remasure runs the PR base tip — not this branch. Failures here are often
      # inherited from main (merge queue skips codecov). Always return to HEAD.
      # Per-workspace Turbo cache: only workspaces the base tip changed (vs the
      # last measured commit) actually run. collectCoverage.js is built from
      # HEAD first; dist/ is gitignored, so it survives the base checkout.
      - name: Measure PR base coverage baseline
        id: measure-base
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline.outputs.cache-hit != 'true' &&
          steps.baseline-artifact.outputs.hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.baseline-ref.outputs.ref }}"
          echo "::notice title=Coverage remasure on PR base tip::Measuring ${CI_BASE_SHA} (${BASE_REF}). Failures in this step are on the base tip — not this PR branch."
          restore_head() {
            git checkout --force "$CI_HEAD_SHA"
            pnpm install --frozen-lockfile
          }
          pnpm precoverage:collect
          trap restore_head EXIT
          git checkout --force "$CI_BASE_SHA"
          pnpm install --frozen-lockfile
          rm -rf projects/*/*/coverage packages/*/coverage
          pnpm exec turbo run test:coverage
          node packages/scripts/dist/collectCoverage.js .coverage-baseline
          printf '%s\n' "$CI_BASE_SHA" > .coverage-baseline/source-sha.txt
          printf 'exact-remasure\n' > .coverage-baseline/source-kind.txt
          trap - EXIT
          restore_head

      - name: Warn that base tip remasure failed
        if: >-
          github.event_name == 'pull_request' &&
          steps.measure-base.outcome == 'failure'
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.baseline-ref.outputs.ref }}"
          MSG="Remeasuring \`${CI_BASE_SHA}\` on \`${BASE_REF}\` failed. That SHA is the PR **base tip**, not this branch — test/coverage failures in the remasure step are usually not caused by this PR. Falling back to the last successful \`${BASE_REF}\` coverage cache when available."
          echo "::warning title=PR base tip remasure failed (likely not this branch)::${MSG}"
          {
            echo "## Coverage remasure"
            echo ""
            echo "> [!WARNING]"
            echo "> ${MSG}"
            echo ""
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Restore last successful base-branch coverage baseline
        id: baseline-fallback
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline.outputs.cache-hit != 'true' &&
          steps.measure-base.outcome == 'failure'
        uses: actions/cache/restore@v6
        with:
          path: .coverage-baseline
          # Unique key per tip; restore-keys picks the newest green tip for the
          # base branch when the exact base SHA was never cached.
          key: coverage-summary-branch-${{ steps.baseline-ref.outputs.alias }}-${{ env.CI_BASE_SHA }}
          restore-keys: |
            coverage-summary-branch-${{ steps.baseline-ref.outputs.alias }}-

      # Historical greens (e.g. last main tip that passed codecov) still live
      # under coverage-summary-<sha>. Walk first-parent ancestry of the base tip
      # and restore the newest ancestor that has a cache entry.
      - name: Find ancestor coverage baseline SHA
        id: baseline-ancestor
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline.outputs.cache-hit != 'true' &&
          steps.measure-base.outcome == 'failure' &&
          hashFiles('.coverage-baseline/**/coverage-summary.json') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          # Paginate Actions cache list; keep exact SHA keys only (not branch-*).
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[].key' \
            | grep -E '^coverage-summary-[0-9a-f]{40}$' \
            | sed 's/^coverage-summary-//' \
            | sort -u > "$TMP"

          FOUND=""
          while IFS= read -r sha; do
            if grep -Fxq "$sha" "$TMP"; then
              FOUND="$sha"
              break
            fi
          done < <(git rev-list --first-parent "$CI_BASE_SHA")

          if [ -z "$FOUND" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No coverage-summary-<sha> cache among first-parent ancestors of ${CI_BASE_SHA}" >&2
            exit 0
          fi

          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "sha=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "Using ancestor coverage baseline ${FOUND} (exact base ${CI_BASE_SHA} unavailable)" >&2

      - name: Restore ancestor coverage baseline
        id: baseline-ancestor-restore
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline-ancestor.outputs.hit == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ steps.baseline-ancestor.outputs.sha }}
          fail-on-cache-miss: false

      - name: Report coverage baseline source
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.baseline-ref.outputs.ref }}"
          ALIAS="${{ steps.baseline-ref.outputs.alias }}"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          has_baseline() {
            find .coverage-baseline -name coverage-summary.json 2>/dev/null | grep -q .
          }
          {
            echo "## Coverage baseline"
            echo ""
          } | tee -a "$SUMMARY"

          if [ "${{ steps.baseline.outputs.cache-hit }}" = "true" ]; then
            KIND="exact-cache"
            SOURCE_SHA="$CI_BASE_SHA"
          elif [ "${{ steps.baseline-artifact.outputs.hit }}" = "true" ]; then
            KIND="exact-artifact"
            SOURCE_SHA="$CI_BASE_SHA"
          elif [ "${{ steps.measure-base.outcome }}" = "success" ]; then
            KIND="exact-remasure"
            SOURCE_SHA="$CI_BASE_SHA"
          elif has_baseline; then
            if [ "${{ steps.baseline-ancestor.outputs.hit }}" = "true" ]; then
              KIND="ancestor-fallback"
              SOURCE_SHA="${{ steps.baseline-ancestor.outputs.sha }}"
            else
              # restore-keys hits set cache-hit=false; trust the restored files.
              KIND="branch-fallback"
              if [ -f .coverage-baseline/source-sha.txt ]; then
                SOURCE_SHA="$(tr -d '[:space:]' < .coverage-baseline/source-sha.txt)"
              else
                SOURCE_SHA="unknown (missing source-sha.txt)"
              fi
            fi
          else
            {
              echo "::error title=No coverage baseline (base tip broken — not this PR)::Could not restore or remasure base \`${CI_BASE_SHA}\` (\`${BASE_REF}\`), and no last-successful branch/ancestor baseline exists either."
              echo ""
              echo "The remasure step runs **the PR base tip**, not this branch. The Vitest failures above are on \`${BASE_REF}\` @ \`${CI_BASE_SHA}\` — fix or bypass on the base branch; this PR may be fine."
              echo ""
              echo "- Base SHA: \`${CI_BASE_SHA}\`"
              echo "- Base ref: \`${BASE_REF}\`"
              echo "- Exact cache: miss"
              echo "- Exact remasure: ${{ steps.measure-base.outcome }}"
              echo "- Branch fallback prefix: \`coverage-summary-branch-${ALIAS}-\`: miss"
              echo "- Ancestor SHA fallback: miss"
            } | tee -a "$SUMMARY"
            exit 1
          fi

          if ! has_baseline; then
            echo "::error::Baseline present according to restore/remasure, but coverage-summary.json is missing" >&2
            exit 1
          fi

          printf '%s\n' "$KIND" > .coverage-baseline/source-kind.txt
          printf '%s\n' "$SOURCE_SHA" > .coverage-baseline/source-sha.txt
          {
            echo "- Kind: \`${KIND}\`"
            echo "- Baseline SHA: \`${SOURCE_SHA}\`"
            echo "- PR base SHA: \`${CI_BASE_SHA}\`"
            echo "- PR base ref: \`${BASE_REF}\`"
            if [ "$KIND" = "branch-fallback" ]; then
              echo "- Matched cache key: \`${{ steps.baseline-fallback.outputs.cache-matched-key }}\`"
            fi
            if [ "$KIND" = "ancestor-fallback" ]; then
              echo "- Ancestor cache key: \`coverage-summary-${SOURCE_SHA}\`"
            fi
            echo ""
          } | tee -a "$SUMMARY"

          if [ "$KIND" = "branch-fallback" ] || [ "$KIND" = "ancestor-fallback" ]; then
            MSG="Exact base \`${CI_BASE_SHA}\` on \`${BASE_REF}\` could not be measured (tests failing on the **base tip**, not necessarily this PR). Using ${KIND} coverage from \`${SOURCE_SHA}\`. Ratchet may reflect base-tip drift."
            echo "::warning title=Coverage baseline fell back (base tip unavailable)::${MSG}"
            {
              echo "> [!WARNING]"
              echo "> ${MSG}"
              echo ">"
              echo "> Remasure logs are for \`${CI_BASE_SHA}\` on \`${BASE_REF}\` — do not treat those failures as regressions introduced by this branch."
              echo ""
            } | tee -a "$SUMMARY"
          fi

      # One Turbo task per workspace. Workspaces whose source and internal
      # dependencies are unchanged restore from the (remote) Turbo cache.
      - name: Coverage per workspace (Turbo-cached)
        run: |
          set -euo pipefail
          rm -rf projects/*/*/coverage packages/*/coverage
          pnpm exec turbo run test:coverage
          pnpm coverage:collect

      - name: Compare coverage with PR base
        if: github.event_name == 'pull_request'
        run: |
          pnpm coverage:compare

      # Cache this tip so stacked outer PRs can restore it as their base.
      - name: Prepare coverage baseline for cache
        run: |
          set -euo pipefail
          rm -rf .coverage-baseline
          cp -R coverage/workspaces .coverage-baseline
          printf '%s\n' "$CI_HEAD_SHA" > .coverage-baseline/source-sha.txt
          printf 'head\n' > .coverage-baseline/source-kind.txt

      - name: Save coverage baseline
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ env.CI_HEAD_SHA }}

      # Same baseline as an artifact: stacked outer PRs cannot restore the cache
      # above (it is scoped to this PR's ref), but can download artifacts.
      - name: Upload coverage baseline artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline-${{ env.CI_HEAD_SHA }}
          path: .coverage-baseline
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      # Floating "last green tip" for this branch (push only). Unique key per
      # SHA so saves do not collide; PR fallback uses restore-keys on the prefix.
      - name: Save last successful branch coverage baseline
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-branch-${{ steps.baseline-ref.outputs.alias }}-${{ env.CI_HEAD_SHA }}

      # History only — codecov.yml disables GitHub statuses/comments/checks.
      - name: Upload coverage to Codecov
        if: hashFiles('coverage/workspaces/**/lcov.info') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          directory: coverage/workspaces
          flags: unit
          name: vitest
          override_commit: ${{ env.CI_HEAD_SHA }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: false
          verbose: true
