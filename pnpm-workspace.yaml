packages:
  - projects/*/*
  - packages/*
  - tooling/*

# Prefer the default catalog so shared versions live in one place.
catalogMode: prefer

# esbuild's postinstall swaps its JS launcher for the native binary.
onlyBuiltDependencies:
  - esbuild

overrides:
  # @react-email/ui pins next@16.3.3, which is affected by GHSA-vcvr-r3jv-pc5j.
  # Drop once it depends on next >=16.3.6.
  next: ^16.3.8

